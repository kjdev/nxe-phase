name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

defaults:
  run:
    shell: sh

jobs:
  unit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Set up step
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          set-safe-directory: true
          token: ${{ github.token }}
      - name: Test
        run: |
          make test
        working-directory: tests/unit
      - name: Test ASan
        run: |
          make test-asan
        working-directory: tests/unit
      - name: Test Coverage
        run: |
          make test-cov
        working-directory: tests/unit
    timeout-minutes: 30

  prove:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Set up step
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cpanminus \
            curl
          if [ "${nginx_version}" = "ubuntu" ]; then
            sudo apt-get install -y --no-install-recommends \
              nginx \
              nginx-dev
          else
            sudo apt-get install -y --no-install-recommends \
              libpcre2-dev \
              libssl-dev \
              zlib1g-dev
          fi
          sudo cpanm -n Test::Nginx
        env:
          nginx_version: ${{ matrix.nginx }}
          PERL_MM_OPT: ''
          PERL_MM_USE_DEFAULT: 1
          PERL5LIB: ''
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          set-safe-directory: true
          token: ${{ github.token }}
      - if: ${{ matrix.nginx == 'ubuntu' }}
        name: Build with Ubuntu
        run: |
          # Download Nginx sources matching the installed package, only
          # needed to build the dummy_a/dummy_b dynamic modules against
          # a matching ABI.
          nginx_version="$(nginx -v 2>&1 | sed -e 's/^[^0-9]*//' -e 's/ .*$//')"
          curl -sL -o "nginx-${nginx_version}.tar.gz" "https://nginx.org/download/nginx-${nginx_version}.tar.gz"
          tar xf "nginx-${nginx_version}.tar.gz"
          # Configure option
          opt=$(nginx -V 2>&1 | tail -1 | sed -e 's/configure arguments://' -e 's| --add-dynamic-module=[^ ]*||g')
          with_cc_opt=$(echo "${opt}" | grep -e "--with-cc-opt='[^']*'" -o | sed -e "s/^--with-cc-opt='//" -e "s/'$//")
          with_ld_opt=$(echo "${opt}" | grep -e "--with-ld-opt='[^']*'" -o | sed -e "s/^--with-ld-opt='//" -e "s/'$//")
          opt=$(echo "${opt}" | sed -e "s|--with-cc-opt='[^']*'||" -e "s|--with-ld-opt='[^']*'||" -e 's/--without-engine//')
          # Drop dynamic modules that pull in dev libraries nginx-dev only
          # provides transitively (libxslt1-dev, libgd-dev, libgeoip-dev,
          # libperl-dev), so this build doesn't implicitly depend on that.
          # Listed explicitly rather than a blanket "=dynamic" regex --
          # --with-mail=dynamic / --with-stream=dynamic have no dev-library
          # dependency and are kept, and --with-compat (no "=dynamic"
          # suffix) is untouched.
          opt=$(echo "${opt}" | sed \
            -e 's/--with-http_xslt_module=dynamic//' \
            -e 's/--with-http_image_filter_module=dynamic//' \
            -e 's/--with-http_geoip_module=dynamic//' \
            -e 's/--with-stream_geoip_module=dynamic//' \
            -e 's/--with-http_perl_module=dynamic//')
          # Build dummy_a and dummy_b, each with its own configure run
          for mod in a b; do
            cp -a "nginx-${nginx_version}" "nginx-${nginx_version}-${mod}"
            cd "nginx-${nginx_version}-${mod}"
            # shellcheck disable=SC2086
            ./configure \
              ${opt} \
              --with-cc-opt="${with_cc_opt}" \
              --with-ld-opt="${with_ld_opt}" \
              --add-dynamic-module="${PWD}/../tests/prove/dummy_${mod}"
            make -j modules
            sudo mkdir -p /usr/lib/nginx/modules
            sudo cp "objs/nxe_phase_test_${mod}_module.so" /usr/lib/nginx/modules/
            cd ..
          done
          sudo mkdir -p /usr/local/sbin
          sudo ln -sfn /usr/sbin/nginx /usr/local/sbin/nginx
      - if: ${{ matrix.nginx != 'ubuntu' }}
        name: Build with sources
        run: |
          # Download Nginx
          curl -sL -o "nginx-${nginx_version}.tar.gz" "https://nginx.org/download/nginx-${nginx_version}.tar.gz"
          tar xf "nginx-${nginx_version}.tar.gz"
          # Base binary (no dynamic module baked in), used as
          # TEST_NGINX_BINARY; --with-compat keeps it ABI-compatible
          # with the dummy_a/dummy_b .so files built below.
          cp -a "nginx-${nginx_version}" "nginx-${nginx_version}-base"
          cd "nginx-${nginx_version}-base"
          ./configure --with-compat --with-pcre --with-pcre-jit
          make -j
          sudo mkdir -p /usr/local/sbin
          sudo cp objs/nginx /usr/local/sbin/
          cd ..
          # Build dummy_a and dummy_b, each with its own configure run
          for mod in a b; do
            cp -a "nginx-${nginx_version}" "nginx-${nginx_version}-${mod}"
            cd "nginx-${nginx_version}-${mod}"
            ./configure \
              --with-compat \
              --with-pcre \
              --with-pcre-jit \
              --add-dynamic-module="${PWD}/../tests/prove/dummy_${mod}"
            make -j modules
            sudo mkdir -p /usr/lib/nginx/modules
            sudo cp "objs/nxe_phase_test_${mod}_module.so" /usr/lib/nginx/modules/
            cd ..
          done
        env:
          nginx_version: ${{ matrix.nginx }}
      - name: Test
        run: |
          # nginx
          echo "::group::nginx show version"
          ${TEST_NGINX_BINARY} -V
          echo "::endgroup::"
          # Run test with both load-order permutations
          set +e
          TEST_NGINX_LOAD_MODULES="${TEST_NGINX_LOAD_MODULES_AB}" prove -r . 2> stderr.log
          status_ab=$?
          TEST_NGINX_LOAD_MODULES="${TEST_NGINX_LOAD_MODULES_BA}" prove -r . 2>> stderr.log
          status_ba=$?
          set -e
          # stderr
          if [ -s stderr.log ]; then
            echo "::group::stderr"
            cat stderr.log
            echo "::endgroup::"
          fi
          if [ "${status_ab}" -ne 0 ] || [ "${status_ba}" -ne 0 ]; then
            exit 1
          fi
        working-directory: tests/prove
        env:
          TEST_NGINX_LOAD_MODULES_AB: /usr/lib/nginx/modules/nxe_phase_test_a_module.so /usr/lib/nginx/modules/nxe_phase_test_b_module.so
          TEST_NGINX_LOAD_MODULES_BA: /usr/lib/nginx/modules/nxe_phase_test_b_module.so /usr/lib/nginx/modules/nxe_phase_test_a_module.so
          TEST_NGINX_SERVROOT: /tmp/servroot
          TEST_NGINX_CONF_DIR: ${{ github.workspace }}/tests/prove/conf
          TEST_NGINX_DATA_DIR: ${{ github.workspace }}/tests/prove/conf
          TEST_NGINX_BINARY: /usr/local/sbin/nginx
          TEST_NGINX_LOG_LEVEL: info
    timeout-minutes: 30
    strategy:
      matrix:
        nginx:
          - ubuntu
          - '1.30.4' # stable
          - '1.31.4' # mainline
